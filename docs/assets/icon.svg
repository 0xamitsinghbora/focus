<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Obsidian / Space Black Glassmorphic Squircle Background -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1E2B" />
      <stop offset="45%" stop-color="#0F1118" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Precision Chamfer Rim Highlight (Apple Pro hardware aesthetic, crisp on taskbar) -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.42)" />
      <stop offset="28%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="70%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <!-- Vibrant Luminous Flow State Aura -->
    <radialGradient id="flowAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.36" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Platinum Ring Gradient with high contrast visibility -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Central Focal Core Gradient -->
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- Refined Drop Shadow for Taskbar / Desktop Pop -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.60" />
    </filter>
  </defs>

  <!-- Squircle Base Tile: Expanded to 1008x1008 (fills 98.4% of canvas for maximum taskbar prominence) -->
  <rect x="8" y="8" width="1008" height="1008" rx="210" ry="210" fill="url(#tileBg)" />
  <rect x="8" y="8" width="1008" height="1008" rx="210" ry="210" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Flow State Ambient Aura (Enlarged to 470px) -->
  <circle cx="512" cy="512" r="470" fill="url(#flowAura)" />

  <!-- Bold & Maximized Focus Mark (Enlarged to fill ~89% of tile) -->
  <g filter="url(#markShadow)">
    <!-- Outer Halo Ring: Radius 426, Stroke 50 (Total diameter 902px) -->
    <circle
      cx="512"
      cy="512"
      r="426"
      fill="none"
      stroke="url(#ringGrad)"
      stroke-width="50"
    />

    <!-- Subtle Inset Horizon Ring: Radius 285, Stroke 7, 38% opacity -->
    <circle
      cx="512"
      cy="512"
      r="285"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      opacity="0.38"
    />

    <!-- The Singular Focal Point / Core of Attention: Radius 142 -->
    <circle
      cx="512"
      cy="512"
      r="142"
      fill="url(#coreGrad)"
    />
    <circle
      cx="512"
      cy="512"
      r="142"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      opacity="0.95"
    />
  </g>
</svg>
